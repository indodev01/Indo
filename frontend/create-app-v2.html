<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Project - Indo</title><link rel="stylesheet" href="create-app-v2.css"><link rel="stylesheet" href="mobile.css?v=1"></head><body><main class="create-page"><header class="topbar"><a class="brand" href="dashboard/index.html"><img src="landing/official-logo.svg" alt="Indo"></a><a class="back-link" href="dashboard/index.html">← Home</a></header><section class="hero"><p class="eyebrow">New project</p><h1>Create your app or website</h1><p>Choose what you want to build, then design it visually for Desktop, Tablet and Mobile.</p></section><form id="createAppForm" class="panel"><div class="field"><label for="appName">Project name</label><input id="appName" name="appName" type="text" maxlength="80" placeholder="e.g. My Store" required></div><div class="field"><label for="appDescription">Description <span>(optional)</span></label><textarea id="appDescription" name="appDescription" rows="4" maxlength="300" placeholder="What will you build?"></textarea></div><div class="field"><label>Project type</label><div class="choices"><label class="choice active"><input type="radio" name="projectType" value="app" checked><span><strong>App</strong><small>Responsive app for Desktop, Tablet and Mobile.</small></span></label><label class="choice"><input type="radio" name="projectType" value="website"><span><strong>Website</strong><small>Responsive website with pages and navigation.</small></span></label></div></div><div class="field"><label>Start from</label><div class="choices"><label class="choice active"><input type="radio" name="startMode" value="blank" checked><span><strong>Blank</strong><small>Start from a clean project.</small></span></label><label class="choice"><input type="radio" name="startMode" value="template"><span><strong>Template</strong><small>Choose a ready-made starter.</small></span></label></div></div><button id="createButton" class="primary-button" type="submit">Create Project</button><p id="message" class="message" role="status"></p></form></main><script type="module" src="create-app-v2.js?v=7"></script></body></html>
