<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data — Indo</title><link rel="stylesheet" href="builder-v2.css"><style>body{background:#060914;color:#fff}.data-page{max-width:1150px;margin:auto;padding:28px}.data-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.data-top h1{margin:3px 0}.data-top p{color:#8994a8;font-size:12px}.data-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:#0d1320;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px}.panel h2{font-size:14px;margin:0 0 12px}.table-list{display:grid;gap:7px}.table-item{width:100%;text-align:left;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.06);padding:11px;border-radius:8px;cursor:pointer}.table-item.active{border-color:#8b5cf6;background:#17132b}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar button{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#7c3aed;color:#fff}.secondary{background:#182132;color:#fff}.danger{background:#3a1620;color:#ffb4c0}.table-wrap{overflow:auto;border:1px solid rgba(255,255,255,.07);border-radius:10px}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;font-size:13px}.data-table th{color:#aeb8c8;font-size:11px;text-transform:uppercase}.empty{padding:35px;text-align:center;color:#8994a8}.dialog{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.dialog input,.dialog select{background:#111827;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:9px}.status{color:#bca4ff;font-size:12px}</style></head><body><main class="data-page"><header class="data-top"><div><p>APP DATA</p><h1 id="projectName">Data Manager</h1><p class="status" id="status">Loading...</p></div><div><button id="backBuilder" class="secondary">← Builder</button><button id="addTable" class="primary">+ Table</button></div></header><section class="data-grid"><aside class="panel"><h2>Tables</h2><div id="tableList" class="table-list"></div></aside><section class="panel"><div class="toolbar"><button id="addColumn" class="secondary">+ Column</button><button id="addRecord" class="primary">+ Record</button></div><div id="tableArea" class="empty">Create or select a table.</div></section></section></main><script type="module" src="data-manager.js"></script></body></html>
