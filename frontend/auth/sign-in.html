<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Indo</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="sign-in.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="../landing/index.html">Indo</a>
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to Indo</h1>
      <p class="helper-text">Use the email and password from your Indo account.</p>

      <form id="signInForm" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Your password" autocomplete="current-password" required>

        <button id="signInButton" class="primary-button" type="submit">Sign In</button>
      </form>

      <p class="utility-link"><a href="forgot-password.html">Forgot password?</a></p>
      <p id="formMessage" class="message" role="status"></p>
      <p class="switch-link">New to Indo? <a href="sign-up.html">Create an account</a></p>
    </section>
  </main>

  <script type="module" src="sign-in.js?v=supabase1"></script>
</body>
</html>
