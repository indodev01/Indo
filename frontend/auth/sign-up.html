<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Indo Dev</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="sign-up.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="../landing/index.html">Indo Dev</a>
      <p class="eyebrow">Create your account</p>
      <h1>Start building your app</h1>
      <p class="helper-text">Create your Indo Dev account with email and password.</p>

      <form id="signUpForm" novalidate>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Create a password" minlength="6" autocomplete="new-password" required>

        <button id="signUpButton" class="primary-button" type="submit">Create Account</button>
      </form>

      <p id="formMessage" class="message" role="status"></p>
      <p class="switch-link">Already have an account? <a href="sign-in.html">Sign in</a></p>
    </section>
  </main>

  <script type="module" src="sign-up.js?v=supabase1"></script>
</body>
</html>
