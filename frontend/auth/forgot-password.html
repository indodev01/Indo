<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - IndoDev</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="../landing/index.html">IndoDev</a>
      <p class="eyebrow">Account recovery</p>
      <h1>Reset your password</h1>
      <p class="helper-text">Enter your account email and we will send a secure reset link.</p>

      <form id="forgotPasswordForm" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <button id="resetButton" class="primary-button" type="submit">Send Reset Link</button>
      </form>

      <p id="formMessage" class="message" role="status"></p>
      <p class="switch-link"><a href="sign-in.html">Back to Sign In</a></p>
    </section>
  </main>

  <script type="module" src="forgot-password.js"></script>
</body>
</html>
