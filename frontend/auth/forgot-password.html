<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Indo Dev</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="../landing/index.html">Indo Dev</a>
      <p class="eyebrow">Account recovery</p>
      <h1>Reset your password</h1>
      <p class="helper-text">Enter your email and we will prepare the password reset flow.</p>

      <form id="forgotPasswordForm">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
        <button class="primary-button" type="submit">Continue</button>
      </form>

      <p id="formMessage" class="message"></p>
      <p class="switch-link"><a href="sign-in.html">Back to Sign In</a></p>
    </section>
  </main>

  <script src="forgot-password.js"></script>
</body>
</html>
