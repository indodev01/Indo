<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New App - Indo Dev</title>
  <link rel="stylesheet" href="create-app.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <a href="index.html" class="back-link">← Back to Dashboard</a>
      <h1>Create New App</h1>
      <p>Start with a simple app name and choose what you want to build.</p>
    </header>

    <section class="panel">
      <label for="appName">App name</label>
      <input id="appName" type="text" placeholder="Example: My Store">

      <label for="appDescription">Description</label>
      <textarea id="appDescription" rows="5" placeholder="What will your app do?"></textarea>

      <button id="continueButton" class="primary-button">Continue to Templates</button>
      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="create-app.js"></script>
</body>
</html>
