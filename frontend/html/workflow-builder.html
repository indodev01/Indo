<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logic Builder — Indo</title><link rel="stylesheet" href="../css/builder-v2.css"><style>body{background:#060914;color:#fff}.workflow-page{max-width:1050px;margin:auto;padding:28px}.workflow-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.workflow-top h1{margin:4px 0;font-size:30px}.workflow-top p{color:#8994a8;font-size:12px}.workflow-list{display:grid;gap:14px}.workflow-card{padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0d1320}.workflow-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.workflow-name{background:#111827;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 11px;font-weight:800}.workflow-row{display:flex;align-items:center;gap:15px;padding:13px 0;border-top:1px solid rgba(255,255,255,.06)}.workflow-row strong{width:45px;font-size:10px;color:#a78bfa}.workflow-row select{flex:1;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px}.workflow-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.workflow-actions button,.workflow-top button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:800}.primary{background:#7c3aed;color:#fff}.secondary{background:#182132;color:#fff}.danger{background:#3a1620;color:#ffb4c0}.empty{padding:35px;text-align:center;color:#8994a8;border:1px dashed rgba(255,255,255,.12);border-radius:14px}.message{color:#bca4ff;font-size:12px}.workflow-test-panel{margin-top:14px;padding:12px;border-top:1px solid rgba(255,255,255,.06);background:#090f1a;border-radius:10px}.test-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.test-controls label{display:grid;gap:6px;color:#8994a8;font-size:11px}.test-controls textarea{width:100%;resize:vertical;min-height:74px;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px;font:12px ui-monospace,monospace}.test-run{align-self:end;justify-self:start;border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:800}.test-result{margin:10px 0 0;padding:10px;white-space:pre-wrap;overflow:auto;background:#050912;border-radius:8px;color:#b8c2d4;font:11px ui-monospace,monospace}@media(max-width:760px){.test-controls{grid-template-columns:1fr}}</style></head><body><main class="workflow-page"><header class="workflow-top"><div><p>NO-CODE LOGIC</p><h1>Logic Builder</h1><p id="projectName">Loading project...</p></div><div><button id="backBuilder" class="secondary">← Builder</button><button id="addWorkflow" class="primary">+ Workflow</button></div></header><p id="message" class="message"></p><section id="workflowList" class="workflow-list"></section></main><script type="module" src="../js/workflow-builder.js"></script><script type="module" src="../js/workflow-test-panel.js"></script></body></html>
