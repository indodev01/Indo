<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b17">
  <title>Preview — Indo</title>
  <link rel="stylesheet" href="../css/responsive-v1.css?v=1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #060914;
      color: #f7f8ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 18px 24px;
      background:
        radial-gradient(circle at 80% 0%, rgba(138, 69, 255, .13), transparent 25%),
        #060914;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .page-header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .back-link,
    .home-link {
      min-height: 38px;
      padding: 0 11px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 9px;
      background: rgba(255, 255, 255, .035);
      color: #c1c9d7;
      cursor: pointer;
      font-size: 10px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 22px;
    }

    .page-header p {
      margin: 4px 0 0;
      color: #7f8a9e;
      font-size: 9px;
    }

    .preview-frame {
      min-height: calc(100vh - 110px);
      display: grid;
      place-items: center;
      padding: 30px;
    }

    .preview-canvas {
      width: min(100%, 1100px);
      min-height: 720px;
      padding: 14px;
      overflow: auto;
      border: 1px solid #272e3b;
      border-radius: 14px;
      background: linear-gradient(180deg, #05070d, #111827);
      box-shadow: 0 28px 70px rgba(0, 0, 0, .45);
      transition: width .18s ease, min-height .18s ease, border-radius .18s ease;
    }

    .preview-canvas:empty::before {
      content: 'Live preview';
      display: grid;
      place-items: center;
      min-height: 650px;
      color: #6d788c;
      font-size: 11px;
    }

    .preview-canvas > * {
      color: inherit;
    }

    #previewDeviceToolbar {
      width: 100%;
    }

    #previewDeviceToolbar button.active {
      background: #7c3aed !important;
      color: #fff !important;
      border-color: rgba(167, 139, 250, .65) !important;
    }

    @media (max-width: 820px) {
      .page {
        padding: 12px;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .page-header-actions {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .page-header-actions > * {
        width: 100%;
      }

      .preview-frame {
        padding: 16px 0;
      }

      .preview-canvas {
        width: 100%;
        min-height: 600px;
        padding: 8px;
        border-radius: 10px;
      }
    }

    @media (max-width: 430px) {
      .page {
        padding: 8px;
      }

      .page-header h1 {
        font-size: 19px;
      }

      .preview-frame {
        padding: 10px 0;
      }

      .preview-canvas {
        min-height: 540px;
        padding: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="page-header-actions">
        <button id="backButton" class="back-link" type="button">← Back to Builder</button>
        <button id="homeButton" class="home-link" type="button">Home</button>
      </div>

      <div>
        <h1>Live Preview</h1>
        <p id="previewInfo">Loading your project preview...</p>
      </div>
    </header>

    <section class="preview-frame" aria-label="Project preview">
      <div id="previewCanvas" class="preview-canvas"></div>
    </section>
  </main>

  <script type="module" src="../js/preview.js?v=10"></script>
  <script type="module" src="../js/preview-video.js?v=1"></script>
  <script type="module" src="../js/preview-layout.js?v=1"></script>
  <script type="module" src="../js/preview-responsive.js?v=1"></script>
  <script type="module" src="../js/preview-device-controller.js?v=1"></script>
</body>
</html>
