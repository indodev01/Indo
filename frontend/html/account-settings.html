<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b17"><title>Account Settings — Indo</title><link rel="stylesheet" href="../css/dashboard-clean.css?v=5"><style>body{background:#060914;color:#f7f8ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.settings-wrap{width:min(760px,calc(100% - 32px));margin:40px auto}.settings-card{padding:24px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:#111827;box-shadow:0 24px 70px rgba(0,0,0,.35)}.settings-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.settings-head h1{margin:0;font-size:24px}.settings-head p{margin:5px 0 0;color:#8e99ad;font-size:12px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;font-weight:800;color:#aeb8c8}.field input{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0b111d;color:#eef2f9;outline:none}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}.actions a,.actions button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:900;text-decoration:none}.back{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#c7cfdd}.save{border:0;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff}.status{min-height:18px;margin-top:10px;color:#9ca8ba;font-size:11px}</style></head><body><main class="settings-wrap"><section class="settings-card"><div class="settings-head"><div><h1>Account Settings</h1><p>Update the name shown across your Indo workspace.</p></div><strong style="font-size:12px;color:#a78bfa">Indo</strong></div><div class="field"><label for="name">Display name</label><input id="name" type="text" maxlength="80" autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" readonly></div><div id="status" class="status"></div><div class="actions"><a class="back" href="../index.html">Back to Dashboard</a><button id="save" class="save" type="button">Save Changes</button></div></section></main><script type="module" src="../js/account-settings.js?v=1"></script></body></html>
