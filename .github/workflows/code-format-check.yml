name: Code Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check repository formatting
        run: npx --yes prettier@3.6.2 --check "frontend/**/*.{html,css,js,mjs,json}" "scripts/**/*.{js,mjs,json}" "*.{json,yml,yaml}" ".github/workflows/*.{yml,yaml}"
