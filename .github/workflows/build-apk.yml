name: Build Indo APK

on:
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Published Indo app URL'
        required: true
        type: string
      application_id:
        description: 'Android application ID'
        required: false
        default: 'com.indodev01.generated'
        type: string
      version_name:
        description: 'App version'
        required: false
        default: '1.0'
        type: string
      build_token:
        description: 'One-time build callback token'
        required: true
        type: string
      icon_url:
        description: 'HTTPS app icon image URL'
        required: false
        default: ''
        type: string
      splash_url:
        description: 'HTTPS splash image URL'
        required: false
        default: ''
        type: string

concurrency:
  group: indo-apk-${{ inputs.build_token }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-wrapper
    env:
      GRADLE_OPTS: '-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false'
      BUILD_CALLBACK_URL: 'https://lpcfgrphadnppqxpwxjv.supabase.co/functions/v1/build-callback-v2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate APK inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ inputs.build_token }}" ]] || { echo 'build_token is required'; exit 1; }
          [[ "${{ inputs.build_token }}" =~ ^[A-Za-z0-9._:-]{24,200}$ ]] || { echo 'build_token must be 24-200 safe characters'; exit 1; }
          [[ "${{ inputs.live_url }}" =~ ^https:// ]] || { echo 'live_url must use HTTPS'; exit 1; }
          [[ "${{ inputs.application_id }}" =~ ^com\.[a-z0-9]+(\.[a-z0-9]+)+$ ]] || { echo 'Invalid application_id'; exit 1; }
          [[ "${{ inputs.version_name }}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid version_name'; exit 1; }
          if [[ -n "${{ inputs.icon_url }}" ]]; then
            [[ "${{ inputs.icon_url }}" =~ ^https:// ]] || { echo 'icon_url must use HTTPS'; exit 1; }
          fi
          if [[ -n "${{ inputs.splash_url }}" ]]; then
            [[ "${{ inputs.splash_url }}" =~ ^https:// ]] || { echo 'splash_url must use HTTPS'; exit 1; }
          fi

      - name: Notify build started
        run: |
          curl -fsS -X POST "$BUILD_CALLBACK_URL" \
            -H 'content-type: application/json' \
            -H "x-indo-build-token: ${{ inputs.build_token }}" \
            --data-binary '{"build_token":"${{ inputs.build_token }}","status":"building"}'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Prepare stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.INDO_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/indo-release.jks
          test -s signing/indo-release.jks

      - name: Prepare optional app assets
        shell: bash
        env:
          ICON_URL: ${{ inputs.icon_url }}
          SPLASH_URL: ${{ inputs.splash_url }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable app/src/main/res/values
          if [[ -n "$ICON_URL" ]]; then
            curl -fL --retry 3 --max-time 30 "$ICON_URL" -o app/src/main/res/drawable/indo_icon.png
            test -s app/src/main/res/drawable/indo_icon.png
          fi
          if [[ -n "$SPLASH_URL" ]]; then
            curl -fL --retry 3 --max-time 30 "$SPLASH_URL" -o app/src/main/res/drawable/indo_splash.png
            test -s app/src/main/res/drawable/indo_splash.png
          fi

      - name: Verify Gradle environment
        run: gradle --version

      - name: Build signed release APK
        id: apk
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.INDO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INDO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INDO_KEY_PASSWORD }}
        run: >-
          gradle --no-daemon --build-cache --parallel --stacktrace --warning-mode all assembleRelease
          -PLIVE_URL="${{ inputs.live_url }}"
          -PAPPLICATION_ID="${{ inputs.application_id }}"
          -PVERSION_NAME="${{ inputs.version_name }}"
          -PVERSION_CODE="${{ github.run_number }}"
          -PAPP_ICON_FILE="$PWD/app/src/main/res/drawable/indo_icon.png"
          -PSPLASH_FILE="$PWD/app/src/main/res/drawable/indo_splash.png"
          -PRELEASE_KEYSTORE_PATH="signing/indo-release.jks"
          -PRELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          -PRELEASE_KEY_ALIAS="$KEY_ALIAS"
          -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Report build failure
        if: steps.apk.outcome == 'failure'
        run: |
          curl -fsS -X POST "$BUILD_CALLBACK_URL" \
            -H 'content-type: application/json' \
            -H "x-indo-build-token: ${{ inputs.build_token }}" \
            --data-binary '{"build_token":"${{ inputs.build_token }}","status":"failed","error":"Signed release APK build failed. Check the latest GitHub Actions run for logs."}'
          exit 1

      - name: Upload APK artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: indo-apk-${{ inputs.version_name }}
          path: android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish direct APK release
        id: release
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: indo-apk-${{ inputs.build_token }}
          APK_PATH: android-wrapper/app/build/outputs/apk/release/app-release.apk
          APK_NAME: indo-app-v${{ inputs.version_name }}.apk
        run: |
          set -euo pipefail
          cp "$APK_PATH" "/tmp/$APK_NAME"
          gh release create "$RELEASE_TAG" \
            "/tmp/$APK_NAME" \
            --repo "${{ github.repository }}" \
            --title "Indo APK ${{ inputs.version_name }}" \
            --notes "Generated signed APK for Indo project build ${{ inputs.build_token }}." \
            --target "${{ github.sha }}"

      - name: Report release failure
        if: steps.release.outcome == 'failure'
        run: |
          curl -fsS -X POST "$BUILD_CALLBACK_URL" \
            -H 'content-type: application/json' \
            -H "x-indo-build-token: ${{ inputs.build_token }}" \
            --data-binary '{"build_token":"${{ inputs.build_token }}","status":"failed","error":"APK built successfully, but publishing the direct download failed. Check the GitHub Actions run logs."}'
          exit 1

      - name: Report build success
        if: steps.release.outcome == 'success'
        env:
          DIRECT_APK_URL: https://github.com/${{ github.repository }}/releases/download/indo-apk-${{ inputs.build_token }}/indo-app-v${{ inputs.version_name }}.apk
        run: |
          curl -fsS -X POST "$BUILD_CALLBACK_URL" \
            -H 'content-type: application/json' \
            -H "x-indo-build-token: ${{ inputs.build_token }}" \
            --data-binary "{\"build_token\":\"${{ inputs.build_token }}\",\"status\":\"success\",\"artifact_url\":\"${DIRECT_APK_URL}\"}"
