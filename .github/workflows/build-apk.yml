name: Build Indo APK

on:
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Published Indo app URL'
        required: true
        type: string
      application_id:
        description: 'Android application ID'
        required: false
        default: 'com.indodev01.generated'
        type: string
      version_name:
        description: 'App version'
        required: false
        default: '1.0'
        type: string
      build_token:
        description: 'One-time build callback token'
        required: true
        type: string

concurrency:
  group: indo-apk-${{ inputs.build_token }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-wrapper
    env:
      GRADLE_OPTS: '-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Notify build started
        run: |
          curl -fsS -X POST 'https://lpcfgrphadnppqxpwxjv.supabase.co/functions/v1/build-callback' \
            -H 'content-type: application/json' \
            --data-binary '{"build_token":"${{ inputs.build_token }}","status":"building"}'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build debug APK
        id: apk
        continue-on-error: true
        run: >-
          gradle --no-daemon --build-cache --parallel assembleDebug
          -PLIVE_URL="${{ inputs.live_url }}"
          -PAPPLICATION_ID="${{ inputs.application_id }}"
          -PVERSION_NAME="${{ inputs.version_name }}"

      - name: Report build failure
        if: steps.apk.outcome == 'failure'
        run: |
          curl -fsS -X POST 'https://lpcfgrphadnppqxpwxjv.supabase.co/functions/v1/build-callback' \
            -H 'content-type: application/json' \
            --data-binary '{"build_token":"${{ inputs.build_token }}","status":"failed","error":"Gradle assembleDebug failed. See the GitHub Actions run for logs."}'
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: indo-apk-${{ inputs.version_name }}
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Report build success
        if: success()
        run: |
          curl -fsS -X POST 'https://lpcfgrphadnppqxpwxjv.supabase.co/functions/v1/build-callback' \
            -H 'content-type: application/json' \
            --data-binary '{"build_token":"${{ inputs.build_token }}","status":"success","artifact_url":"https://github.com/indodev01/Indo/actions/runs/${{ github.run_id }}"}'
